[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-to-music"
version = "0.1.0"
description = "Versioned scores, real instruments, headless offline audio for coding agents"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.4", "jsonschema==4.26.0", "mido==1.3.3", "pedalboard==0.9.26"]

[project.scripts]
music = "music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music = ["schemas/*.json"]
